# Roda a suíte da demo a cada pull request.
#
# Não é um check obrigatório: a suíte acessa a loja pública saucedemo.com pela
# rede, e uma instabilidade dela não deve travar um merge durante a palestra.
# O resultado aparece no PR do mesmo jeito — que é o ponto da demonstração.

name: testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  demo:
    name: demo e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: demo

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json

      # npm ci, e não npm install: instala exatamente o que está no lock.
      # Sem isso o CI resolveria "^1.58.1" para a versão mais nova do dia, e um
      # check ficaria vermelho por uma atualização que ninguém pediu.
      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # --retries=1 só aqui: a config local mantém 0, porque no palco um teste
      # que passa na segunda tentativa esconde exatamente o que queremos discutir.
      - name: Rodar os testes
        run: npx playwright test --retries=1

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: demo/playwright-report/
          retention-days: 7
